[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daka-cli"
version = "0.1.0"
description = "CLI no oficial para explorar productos, precios y categorías de Tiendas Daka (Venezuela)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "curl_cffi>=0.15",
  "platformdirs>=4",
  "rich>=13",
  "typer>=0.12",
]
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/italovisconti/daka-cli"
Website = "https://tiendasdaka.com/ve"

[project.scripts]
daka = "daka_cli.cli:app"
daka-cli = "daka_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
